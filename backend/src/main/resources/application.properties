spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 256-bit+ Base64 key. Override with JWT_SECRET in production.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.cors.origin=http://localhost:5173
